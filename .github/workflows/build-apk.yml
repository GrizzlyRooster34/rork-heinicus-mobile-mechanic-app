name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK via EAS
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: '20'
          cache: 'npm'

      - name: 🏗 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm install

      - name: 📱 Build APK
        run: npx eas-cli build --platform android --profile standalone --local --non-interactive --output heinicus-app.apk

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heinicus-apk
          path: heinicus-app.apk
